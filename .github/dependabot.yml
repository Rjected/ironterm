# Dependabot, kept quiet on purpose: this project keeps dependencies few and upgrades them by hand.
#
# - GitHub Actions: monthly, one grouped PR, so the pinned commit SHAs in .github/workflows stay
#   current (a pinned action never picks up fixes on its own).
# - npm, Gradle, Cargo: open-pull-requests-limit 0 turns off routine version bumps. Dependabot
#   *security* updates still open PRs for known vulnerabilities, once "Dependabot security
#   updates" is on in the repository's Settings → Code security.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
