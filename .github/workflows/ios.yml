name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # The project uses folder-synchronised groups (objectVersion 77): Xcode 16+.
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app + widgets (Debug)
        run: |
          xcodebuild build \
            -project Ironterm.xcodeproj \
            -scheme Ironterm \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build tests
        run: |
          xcodebuild build-for-testing \
            -project Ironterm.xcodeproj \
            -scheme Ironterm \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build app + widgets (Release)
        run: |
          xcodebuild build \
            -project Ironterm.xcodeproj \
            -scheme Ironterm \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
