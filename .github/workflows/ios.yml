name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: jobs read the repo and nothing else unless they say so.
permissions:
  contents: read

jobs:
  ios:
    # The project uses folder-synchronised groups (objectVersion 77): Xcode 16+.
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # newest stable Xcode on the runner image, not the image default
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app + widgets (Debug)
        run: |
          xcodebuild build \
            -project Ironterm.xcodeproj \
            -scheme Ironterm \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build tests
        run: |
          xcodebuild build-for-testing \
            -project Ironterm.xcodeproj \
            -scheme Ironterm \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build app + widgets (Release)
        run: |
          xcodebuild build \
            -project Ironterm.xcodeproj \
            -scheme Ironterm \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
