name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ios:
    # The project uses folder-synchronised groups (objectVersion 77): Xcode 16+.
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      # newest stable Xcode on the runner image, not the image default
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app + widgets (Debug)
        run: |
          xcodebuild build \
            -project Ironterm.xcodeproj \
            -scheme Ironterm \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build tests
        run: |
          xcodebuild build-for-testing \
            -project Ironterm.xcodeproj \
            -scheme Ironterm \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build app + widgets (Release)
        run: |
          xcodebuild build \
            -project Ironterm.xcodeproj \
            -scheme Ironterm \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
