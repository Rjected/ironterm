name: CLI

on:
  push:
    branches: [main]
    paths: ["src/**", "Cargo.*", ".github/workflows/cli.yml"]
  pull_request:
    branches: [main]

# Least privilege: jobs read the repo and nothing else unless they say so.
permissions:
  contents: read

# One run per branch or PR: a new push to a PR cancels its stale run. Pushes to main never
# cancel each other (the Android release job publishes over-the-air updates).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked
      - run: cargo test --locked
