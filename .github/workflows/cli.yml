name: CLI

on:
  push:
    branches: [main]
    paths: ["src/**", "Cargo.*", ".github/workflows/cli.yml"]
  pull_request:
    branches: [main]
    paths: ["src/**", "Cargo.*", ".github/workflows/cli.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked
