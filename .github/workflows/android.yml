name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  # every PR runs it: it's a required check on main
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs read the repo and nothing else unless they say so.
permissions:
  contents: read

# One run per branch or PR: a new push to a PR cancels its stale run. Pushes to main never
# cancel each other (the Android release job publishes over-the-air updates).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      # What gradle/actions/setup-gradle used to check: the committed wrapper jar is an official
      # Gradle release (this is the published checksum of the Gradle 8.4 wrapper jar).
      # The distribution it downloads is checked by distributionSha256Sum.
      - name: Verify Gradle wrapper
        run: echo "0336f591bc0ec9aa0c9988929b93ecc916b3c1d52aed202c7381db144aa0ef15  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Unit + screenshot tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ironterm-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Every merge to main that touches the app ships a signed release. The app checks
  # GitHub Releases and updates itself over the air (see android/README.md → Updates).
  release:
    needs: android
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    env:
      # versionCode must only ever go up; the offset keeps it above early local builds
      IRONTERM_VERSION_CODE: ${{ github.run_number }}00
      IRONTERM_VERSION_NAME: 2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      # What gradle/actions/setup-gradle used to check: the committed wrapper jar is an official
      # Gradle release (this is the published checksum of the Gradle 8.4 wrapper jar).
      # The distribution it downloads is checked by distributionSha256Sum.
      - name: Verify Gradle wrapper
        run: echo "0336f591bc0ec9aa0c9988929b93ecc916b3c1d52aed202c7381db144aa0ef15  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_B64 secret missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "IRONTERM_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          IRONTERM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IRONTERM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IRONTERM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IRONTERM_UPDATE_REPO: ${{ github.repository }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ironterm-$IRONTERM_VERSION_NAME.apk"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs "$RUNNER_TEMP/ironterm-$IRONTERM_VERSION_NAME.apk" | head -3

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v$IRONTERM_VERSION_CODE"
          NOTES=$(git log -1 --pretty=%s)
          gh release create "$TAG" "$RUNNER_TEMP/ironterm-$IRONTERM_VERSION_NAME.apk" \
            --title "Ironterm for Android $IRONTERM_VERSION_NAME" \
            --notes "$NOTES"$'\n\n'"Install: open this page on your phone and tap the APK. The app updates itself from here afterwards." \
            --latest
