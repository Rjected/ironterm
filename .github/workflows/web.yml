name: Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: jobs read the repo and nothing else unless they say so.
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.21.1'

      # pnpm via Node's own corepack, at the version and hash pinned in package.json
      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build (Cloudflare + self-hosted Node)
        run: pnpm build:node

      - name: Docker image builds
        run: docker build -t ironterm:ci .
