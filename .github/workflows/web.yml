name: Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build (Cloudflare + self-hosted Node)
        run: pnpm build:node
      - name: CLI builds and runs
        run: pnpm cli --help

      - name: Docker image builds
        run: docker build -t ironterm:ci .
