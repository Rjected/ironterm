name: Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: jobs read the repo and nothing else unless they say so.
permissions:
  contents: read

# One run per branch or PR: a new push to a PR cancels its stale run. Pushes to main never
# cancel each other (the Android release job publishes over-the-air updates).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.21.1'

      # pnpm via Node's own corepack, at the version and hash pinned in package.json
      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build (Cloudflare + self-hosted Node)
        run: pnpm build:node
      - name: CLI builds and runs
        run: pnpm cli --help

      - name: Docker image builds
        run: docker build -t ironterm:ci .
